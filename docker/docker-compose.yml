services:
  postgres:
    image: postgres:16
    container_name: smartiepaws-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartiepaws
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: smartiepaws_inventory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
